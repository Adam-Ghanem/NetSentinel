name: PCAP Ingestion Contracts

on:
  pull_request:
    branches: [main]
    paths:
      - "app/database.py"
      - "app/pcap_ingestion.py"
      - "dashboard/streamlit_app.py"
      - "scripts/ingest_pcap.py"
      - "tests/test_database.py"
      - "tests/test_dashboard_pcap_boundary.py"
      - "tests/test_pcap_format_validation.py"
      - "tests/test_pcap_ingestion.py"
      - "tests/test_pcap_ingestion_security.py"
      - "tests/test_pcap_cli.py"
      - ".github/workflows/pcap-ingestion.yml"
  push:
    branches: [main]
    paths:
      - "app/database.py"
      - "app/pcap_ingestion.py"
      - "dashboard/streamlit_app.py"
      - "scripts/ingest_pcap.py"
      - "tests/test_database.py"
      - "tests/test_dashboard_pcap_boundary.py"
      - "tests/test_pcap_format_validation.py"
      - "tests/test_pcap_ingestion.py"
      - "tests/test_pcap_ingestion_security.py"
      - "tests/test_pcap_cli.py"
      - ".github/workflows/pcap-ingestion.yml"

permissions:
  contents: read

concurrency:
  group: pcap-ingestion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: PCAP contracts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint PCAP ingestion contracts
        run: >-
          python -m ruff check
          app/database.py
          app/pcap_ingestion.py
          dashboard/streamlit_app.py
          scripts/ingest_pcap.py
          tests/test_database.py
          tests/test_dashboard_pcap_boundary.py
          tests/test_pcap_format_validation.py
          tests/test_pcap_ingestion.py
          tests/test_pcap_ingestion_security.py
          tests/test_pcap_cli.py

      - name: Run PCAP ingestion contracts
        run: >-
          python -m pytest
          tests/test_database.py
          tests/test_dashboard_pcap_boundary.py
          tests/test_pcap_format_validation.py
          tests/test_pcap_ingestion.py
          tests/test_pcap_ingestion_security.py
          tests/test_pcap_cli.py
